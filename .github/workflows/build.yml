name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]" requests

      - name: Build APK with Flet
        run: |
          printf 'y\n' | flet build apk --project "IPResolver" --org "com.tariknet.ipresolver" --permissions INTERNET -vv

      - name: Find and Prepare APK
        run: |
          mkdir -p output
          find . -name "*.apk" -type f -exec cp {} output/IPResolver.apk \;
          ls -lh output/

      - name: Release Direct APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "IPResolver Update #${{ github.run_number }}"
          files: output/IPResolver.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
